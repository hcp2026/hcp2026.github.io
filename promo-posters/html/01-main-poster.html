<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HCP 2026 - 大会主海报</title>
  <style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: #14090d;
  font-family: "Hiragino Sans GB", "STHeiti", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
  color: #17191f;
}
body {
  width: 1080px;
  height: 1920px;
  overflow: hidden;
}
.poster {
  position: relative;
  width: 1080px;
  height: 1920px;
  overflow: hidden;
  background:
    linear-gradient(180deg, rgba(80, 12, 23, .92) 0%, rgba(124, 20, 39, .90) 38%, rgba(248, 241, 231, .96) 38.1%, rgba(255, 250, 243, 1) 100%),
    url("../../assets/sdu-qingdao-library-hero.jpg") center top / cover no-repeat;
}
.poster::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 18% 8%, rgba(216, 177, 95, .22), transparent 26%),
    linear-gradient(135deg, rgba(255,255,255,.08), transparent 42%),
    linear-gradient(180deg, rgba(79, 12, 23, .10), rgba(79, 12, 23, .02));
  pointer-events: none;
}
.top-rule {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 16px;
  background: linear-gradient(90deg, #a71930 0%, #d8b15f 78%, #fff2cc 100%);
}
.inner {
  position: relative;
  z-index: 1;
  height: 100%;
  padding: 54px 58px 48px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 22px;
  color: rgba(255,255,255,.92);
}
.brand img {
  width: 236px;
  filter: brightness(0) invert(1);
}
.brand .series {
  margin-left: auto;
  color: #f7dfaa;
  font-size: 22px;
  font-weight: 900;
  letter-spacing: 6px;
}
.hero-title {
  margin-top: 34px;
  color: #fff;
}
.hero-title .kicker {
  color: #f7dfaa;
  font-size: 23px;
  font-weight: 900;
  letter-spacing: 12px;
}
.hero-title h1 {
  margin: 16px 0 0;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 104px;
  line-height: .9;
  letter-spacing: 2px;
}
.hero-title .cn {
  margin-top: 14px;
  font-size: 30px;
  line-height: 1.35;
  font-weight: 900;
}
.hero-title .en {
  margin-top: 6px;
  width: 850px;
  color: rgba(255,255,255,.74);
  font-size: 18px;
  line-height: 1.42;
}
.meta-strip {
  display: flex;
  gap: 12px;
  margin-top: 22px;
}
.meta-pill {
  padding: 10px 16px;
  color: #4f0c17;
  background: #f4dfb0;
  border-radius: 999px;
  font-size: 19px;
  font-weight: 900;
}
.content {
  position: absolute;
  left: 58px;
  right: 58px;
  top: 520px;
  bottom: 94px;
}
.footer {
  position: absolute;
  left: 58px;
  right: 58px;
  bottom: 35px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: #761120;
  border-top: 2px solid rgba(167,25,48,.24);
  padding-top: 18px;
  font-size: 20px;
  font-weight: 900;
}
.footer .url {
  font-family: Georgia, "Times New Roman", serif;
  letter-spacing: 1px;
}
.section-title {
  display: flex;
  align-items: baseline;
  gap: 16px;
  color: #761120;
}
.section-title h2 {
  margin: 0;
  color: #fff;
  font-size: 46px;
  line-height: 1;
  font-weight: 900;
  text-shadow: 0 6px 18px rgba(0,0,0,.22);
}
.section-title .en {
  color: #d8b15f;
  font-size: 18px;
  font-weight: 900;
  letter-spacing: 4px;
  text-transform: uppercase;
}
.tag {
  display: inline-flex;
  align-items: center;
  height: 28px;
  padding: 0 10px;
  color: #fff;
  background: #a71930;
  border-radius: 5px;
  font-size: 15px;
  font-weight: 900;
  letter-spacing: .5px;
}
.muted {
  color: #69707d;
}

.main-panel {
  display: grid;
  grid-template-columns: 1.05fr .95fr;
  gap: 22px;
  margin-top: 24px;
}
.main-info {
  display: grid;
  gap: 16px;
}
.info-box,
.qr-panel {
  padding: 22px;
  background: rgba(255,255,255,.90);
  border: 1px solid rgba(167,25,48,.16);
  border-radius: 17px;
  box-shadow: 0 12px 34px rgba(79,12,23,.10);
}
.info-box .label {
  color: #a2783c;
  font-size: 16px;
  font-weight: 900;
  letter-spacing: 4px;
}
.info-box .value {
  margin-top: 8px;
  color: #17191f;
  font-size: 30px;
  line-height: 1.35;
  font-weight: 900;
}
.info-box .sub {
  margin-top: 8px;
  color: #69707d;
  font-size: 18px;
  line-height: 1.5;
  font-weight: 800;
}
.qr-panel h3 {
  margin: 0 0 18px;
  color: #761120;
  font-size: 30px;
  font-weight: 900;
}
.qr-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
}
.qr-item {
  padding: 14px;
  background: #fffaf3;
  border: 1px solid #eadfd4;
  border-radius: 14px;
  text-align: center;
}
.qr-item.wide {
  grid-column: 1 / -1;
}
.qr-item img {
  width: 170px;
  height: 170px;
  object-fit: contain;
  background: #fff;
  border-radius: 10px;
}
.qr-item.wide img {
  width: 190px;
  height: 260px;
}
.qr-item .caption {
  margin-top: 10px;
  color: #761120;
  font-size: 20px;
  font-weight: 900;
}
.main-note {
  margin-top: 20px;
  padding: 22px;
  color: #fff;
  background: linear-gradient(135deg, #a71930, #761120);
  border-radius: 17px;
  font-size: 25px;
  line-height: 1.6;
  font-weight: 900;
}
</style>
</head>
<body>
  <article class="poster">
    <div class="top-rule"></div>
    <div class="inner">
      <header class="brand">
        <img src="../../assets/sdu-logo.svg" alt="山东大学" />
        <div class="series">宣传海报</div>
      </header>
      <section class="hero-title">
        <div class="kicker">第 九 届</div>
        <h1>HCP 2026</h1>
        <div class="cn">难解问题的理论、算法与应用研讨会</div>
        <div class="meta-strip">
          <div class="meta-pill">2026年7月31日-8月2日</div>
          <div class="meta-pill">山东大学青岛校区</div>
        </div>
      </section>
      <main class="content">
        <div class="section-title"><h2>大会主海报</h2></div>
        <div class="main-panel">
  <section class="main-info">
    <article class="info-box">
      <div class="label">会议时间</div>
      <div class="value">2026年7月31日-8月2日</div>
      <div class="sub">7月31日报到注册；8月1日-2日大会报告与专题交流。</div>
    </article>
    <article class="info-box">
      <div class="label">会议地点</div>
      <div class="value">山东大学青岛校区淦昌苑D座305会议厅</div>
      <div class="sub">报到地点：青岛蓝谷国际酒店大堂。</div>
    </article>
    <article class="info-box">
      <div class="label">承办单位</div>
      <div class="value">山东大学网络空间安全学院</div>
      <div class="sub">会议聚焦难解计算问题的理论、算法与应用，欢迎参会交流。</div>
    </article>
  </section>
  <section class="qr-panel">
    <h3>扫码获取会议信息</h3>
    <div class="qr-grid">
      <div class="qr-item">
        <img src="../tmp/website-qr.png" alt="会议官网二维码" />
        <div class="caption">会议官网</div>
      </div>
      <div class="qr-item">
        <img src="../../assets/register-qr.png" alt="会议注册二维码" />
        <div class="caption">扫码注册</div>
      </div>
      <div class="qr-item wide">
        <img src="../../assets/wechat-group-qr.png" alt="参会微信群二维码" />
        <div class="caption">参会微信群</div>
      </div>
    </div>
  </section>
</div>
      </main>
      <footer class="footer">
        <div>山东大学网络空间安全学院 · 青岛</div>
        <div class="url">hcp2026.sincst.cn</div>
      </footer>
    </div>
  </article>
</body>
</html>
